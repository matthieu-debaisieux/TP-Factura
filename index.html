<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>factura</title>
    <link rel="stylesheet" href="./style/style.css" />
  </head>
	<body class="bg-[#f3f4f9] min-h-screen flex flex-col items-center justify-center font-sans antialiased text-slate-800">
		<div class="bg-white p-10 rounded-2xl shadow-sm w-full max-w-[440px] flex flex-col items-center">
		<div class="w-12 h-12 bg-[#554ce3] rounded-xl flex items-center justify-center text-white text-2xl font-bold mb-6">
			F
		</div>
		<h1 class="text-3xl font-extrabold mb-2">Factura</h1>
		<p class="text-slate-400 text-sm mb-8">Connectez-vous à votre espace</p>

		<form id="loginForm" class="w-full space-y-5">

			<div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-lg">
			Identifiant ou mot de passe incorrect.
			</div>

			<div>
			<label class="block text-sm font-bold text-slate-700 mb-2" for="identifiant">
				Identifiant
			</label>
			<input type="text" id="identifiant" placeholder="Identifiant"
				class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder:text-slate-300">
			<span id="error-identifiant" class="hidden text-red-500 text-xs mt-1 block"></span>
			</div>

			<div>
			<label class="block text-sm font-bold text-slate-700 mb-2" for="password">
				Mot de passe
			</label>
			<input type="password" id="password" placeholder="Mot de passe"
				class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder:text-slate-300">
			<span id="error-password" class="hidden text-red-500 text-xs mt-1 block"></span>
			</div>

			<button type="submit" class="w-full bg-[#554ce3] hover:bg-[#483fd1] text-white font-bold py-3 rounded-lg transition-colors mt-2">
			Se connecter
			</button>

		</form>

		<div class="mt-8 text-[12px] text-slate-400 font-medium">
			Identifiants : <span class="text-slate-500">admin / admin123</span> • <span class="text-slate-500">alice / alice456</span>
		</div>
		</div>

		<script src="./src/main.js"></script>
	</body>
</html>
